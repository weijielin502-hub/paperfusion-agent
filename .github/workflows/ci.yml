name: PaperFusion verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest --basetemp .test-tmp
      - run: ruff check paperfusion p2c_tools tests
      - run: docker build -f Dockerfile.runner -t paperfusion-runner:0.2 .
      - run: python -m paperfusion.cli run --mode replay --executor docker --auto-approve --output runs/ci-replay
