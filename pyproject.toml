[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paperfusion"
version = "0.2.0"
description = "Evidence-driven paper-to-project agent workflow with durable execution"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "langchain-openai>=1,<2", "pydantic>=2,<3", "filelock>=3,<5", "python-dotenv>=1,<2", "openai>=2,<4", "tqdm>=4,<5", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
paperfusion = "paperfusion.cli:main"

[tool.setuptools.packages.find]
include = ["paperfusion*", "p2c_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110
include = ["paperfusion/**/*.py", "tests/**/*.py", "p2c_tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
